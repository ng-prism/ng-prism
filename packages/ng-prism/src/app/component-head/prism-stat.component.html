<div
    class="stat"
    [class.stat--ok]="variant() === 'ok'"
    [class.stat--warn]="variant() === 'warn'"
    [class.stat--danger]="variant() === 'danger'">
    <span class="stat__lbl"
        ><span
            class="stat__dot"
            aria-hidden="true"></span
        >{{ label() }}
        @if (note()) {
            <small class="stat__note">{{ note() }}</small>
        }
    </span>
    <span class="stat__thr">{{ threshold() }}</span>
    <span class="stat__val">{{ value() }}</span>
</div>
